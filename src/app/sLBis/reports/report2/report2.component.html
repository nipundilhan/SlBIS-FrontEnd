<div class="container mt-4" style="background-color: #F5F5F5; padding: 10px; border-radius: 10px;">
    <h2 class="text-center " >MONTHLY INQUIRIES - COMPANY REPORT</h2>
  
    <!-- Search Form -->
    <div class="row" style="margin-left: 20px;" >

        <div class="col-md-3">
            <label for="companyCode" style="font-weight: bold;">Company:</label>
            <select id="companyCode" [(ngModel)]="searchParams.company" class="form-control" >
              <option value="">Select Company</option>
              <option value="GIFT_PLANTS">Gift Plants</option>
              <option value="LUMALA">Lumala</option>
              <option value="WATAWALA">Watawala</option>
              <option value="ASIRI_WATCH">Asiri Watches</option>
            </select>
        </div>

      <div class="col-md-3">
        <label for="companyCode" style="font-weight: bold;">Year:</label>
        <select id="companyCode" [(ngModel)]="searchParams.year" class="form-control" >
          <option value="2025">2025</option>
          <option value="2026">2026</option>
          <option value="2027">2027</option>
          <option value="2028">2028</option>
          <option value="2029">2029</option>
        </select>
      </div>
  
      <div class="col-md-3">
        <label for="status" style="font-weight: bold;">Month</label>
        <select id="month" [(ngModel)]="searchParams.month" class="form-control">
            <option *ngFor="let month of months" [value]="month.value">{{ month.name }}</option>
          </select>
      </div>
  
      <div class="col-md-3 d-flex align-items-end">
        <button (click)="search()" class="btn btn-success mt-2" style="margin-right: 10px;">Search</button>
        <button (click)="reset()" class="btn btn-secondary mt-2">Reset</button>
      </div>
    </div>

    <div class="table-container mt-4" style="background-color: #FFFAFA; padding: 25px; border-radius: 10px;">
        <table class="table table-striped table-bordered mt-3" >
          <thead>
            <tr>
              <th>CATEGORY</th>
              <th *ngFor="let column of fixedColumns" style="font-weight: bold;">{{ column }}</th>
              <th>TOTAL</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let row of reportData">
              <td><strong>{{ row.category }}</strong></td>
              <td *ngFor="let column of fixedColumns">
                {{ row.priorities[column] !== undefined ? row.priorities[column] : '-' }}
              </td>
              <td style="font-weight: bold;">{{ row.TOTAL }}</td>
            </tr>
          </tbody>
        </table>
    </div>


    <div class="row" style="margin-left: 20px;" >

        <div class="col-md-6">
            <p style="font-size: 20px; font-weight: bold;"> Total Number of Inquiries - {{totalSum}}</p>
        </div>


  
      <div class="col-md-3">

      </div>
  
      <div class="col-md-3 d-flex align-items-end">
        <button (click)="sendEmail()" class="btn btn-success mt-2" style="margin-right: 10px;">Send Email</button>
      </div>
    </div>

</div>
